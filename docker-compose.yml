services:
  backend:
    build: ./backend
    container_name: backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app 
    environment:
      - ENV=production
      - PYTHONPATH=/app
    env_file:
      - .env.prod
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "5173:5173" # Vite default
    volumes:
      - ./frontend:/app
    working_dir: /app
    command: npm run dev
    environment:
      - CHOKIDAR_USEPOLLING=true